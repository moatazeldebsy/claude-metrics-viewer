name: Documentation
description: Something in the docs is wrong, missing or unclear.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Which page or section?
      description: A link or file path, e.g. docs/backstage-integration.md#access-control.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
      description: Quote the text if it's wrong, and describe what you were trying to do.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
