name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, mock data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  claude-plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate marketplace and plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.330 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.330 plugin validate ./claude-plugin --strict --profile directory

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      # The root app is the dashboard the integration tests run against (mock data).
      - run: npm ci && npm run build
      - name: Typecheck, build
        working-directory: mcp
        run: npm ci && npm run typecheck && npm run build
      - name: Unit and integration tests
        run: |
          PORT=3000 node .output/server/index.mjs &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/api/meta && break; sleep 1; done
          cd mcp && CLAUDE_METRICS_URL=http://localhost:3000 npm test

  backstage:
    name: Backstage plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Root dependencies provide tsx and Playwright for the preview steps.
      - run: npm ci
      - run: corepack enable
      - name: Install, typecheck, lint, test
        working-directory: backstage
        run: |
          yarn install --immutable
          yarn tsc
          yarn lint
          yarn test
          yarn build
      - name: Preview page is up to date
        run: |
          npx tsx backstage/scripts/build-preview.ts
          git diff --exit-code backstage/preview/index.html
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c backstage/preview/playwright.config.ts
