version: 2
updates:
  # Standalone dashboard (npm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Kept at the same exact version as backstage/packages/claude-metrics-lib, whose types
      # (the mock source's cost rows) follow it. Bump both together, by hand.
      - dependency-name: "@anthropic-ai/sdk"
      # 5.3.6 breaks the Nuxt build (Rolldown can't resolve "vue-chartjs"; #21, #29). Skip only
      # this release; the next one will be proposed. Remove once a newer version is out.
      - dependency-name: "vue-chartjs"
        versions: ["5.3.6"]

  # Backstage workspace (Yarn 4)
  - package-ecosystem: npm
    directory: /backstage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the 1.56.2 release on purpose: newer Backstage apps accept plugins built
      # for older releases, not the reverse. See CONTRIBUTING.md before bumping.
      - dependency-name: "@backstage/*"
      # Exact-pinned in claude-metrics-lib to match the root lockfile.
      - dependency-name: "@anthropic-ai/sdk"
      - dependency-name: "date-holidays"
      # Backstage 1.56 is built on React 18, React Router 6, Express 4 and Prettier 2 (backstage-cli formats with
      # it). Major versions of these move with a Backstage bump, not ahead of it; minor and patch
      # updates still come through. Adjust these when bumping Backstage.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
